<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI-Qalqon Cyber Security</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --danger: #ff4b2b;
            --success: #00b09b;
            --warning: #f7b731;
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #111827 100%);
            color: var(--text);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .shield-icon {
            font-size: 48px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4));
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 8px 0 4px 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 13px;
            color: #94a3b8;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            margin-bottom: 16px;
        }

        .input-box {
            position: relative;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 14px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
        }

        .btn-scan {
            width: 100%;
            margin-top: 12px;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-blue) 100%);
            color: #0b0f19;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-scan:active {
            transform: scale(0.98);
        }

        .result-box {
            display: none;
            margin-top: 16px;
            padding: 16px;
            border-radius: 14px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .res-danger {
            background: rgba(255, 75, 43, 0.15);
            border: 1px solid var(--danger);
            color: #ff9985;
        }

        .res-warning {
            background: rgba(247, 183, 49, 0.15);
            border: 1px solid var(--warning);
            color: #ffe082;
        }

        .res-success {
            background: rgba(0, 176, 155, 0.15);
            border: 1px solid var(--success);
            color: #80e2d7;
        }

        .res-header {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .res-body {
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="header">
        <i class="fa-solid => fa-shield-halved shield-icon"></i>
        <div class="title">AI-Qalqon</div>
        <div class="subtitle">Aqlli Kiber-Xavfsizlik Tizimi</div>
    </div>

    <div class="card">
        <div class="input-box">
            <textarea id="userInput" placeholder="Shubhali SMS, havola yoki kartaga oid xabarni shu yerga qo'ying..."></textarea>
        </div>
        <button class="btn-scan" onclick="startScan()">
            <i class="fa-solid fa-microchip"></i> Skanirovka qilish
        </button>

        <div id="resultBox" class="result-box">
            <div id="resHeader" class="res-header"></div>
            <div id="resBody" class="res-body"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function startScan() {
            const text = document.getElementById('userInput').value.trim();
            const resBox = document.getElementById('resultBox');
            const resHeader = document.getElementById('resHeader');
            const resBody = document.getElementById('resBody');

            if (!text) {
                if (tg && tg.showAlert) {
                    tg.showAlert("Iltimos, tahlil qilish uchun matn kiriting!");
                } else {
                    alert("Iltimos, tahlil qilish uchun matn kiriting!");
                }
                return;
            }

            const textLower = text.toLowerCase();
            const urlPattern = /https?:\/\/[^\s]+|www\.[^\s]+|[a-zA-Z0-9][-a-zA-Z0-9]+\.(uz|com|ru|net|org|info|biz)[^\s]*/gi;
            const urls = text.match(urlPattern);

            const dangerWords = [
                "karta", "kod", "sms", "parol", "yutuq", "aksiya", 
                "bloklandi", "tasdiqlang", "10 daqiqada", "konkurs", 
                "sovg'a", "subsidiya", "pul", "click", "payme"
            ];

            const foundWords = dangerWords.filter(w => textLower.includes(w));

            resBox.style.display = "block";

            if (urls || foundWords.length >= 2) {
                resBox.className = "result-box res-danger";
                resHeader.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> YUQORI XAVF (Phishing)`;
                
                let details = "";
                if (urls) details += `<b>Topilgan havola:</b> <code>${urls[0]}</code><br>`;
                if (foundWords.length) details += `<b>Xavfli kalit so'zlar:</b> ${foundWords.join(', ')}<br>`;
                
                resBody.innerHTML = `${details}<br><b>Tavsiya:</b> Ushbu xabar firibgarlik alomatlariga ega. Karta raqamingiz va SMS-kodlarni hech kimga bermang!`;
            } else if (foundWords.length === 1) {
                resBox.className = "result-box res-warning";
                resHeader.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> OGOH BO'LING (Shubhali)`;
                resBody.innerHTML = `<b>Topilgan kalit so'z:</b> ${foundWords[0]}<br><br><b>Tavsiya:</b> Xabarda e'tiborni tortuvchi so'z bor, ehtiyot bo'ling.`;
            } else {
                resBox.className = "result-box res-success";
                resHeader.innerHTML = `<i class="fa-solid fa-circle-check"></i> XAVFSIZ`;
                resBody.innerHTML = `Matnda yaqqol kiber-tahdid belgilari topilmadi.`;
            }
        }
    </script>
</body>
</html>
